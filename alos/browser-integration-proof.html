<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MissedCall Rescue AI — ALOS Integration Proof</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:32px;background:#fff;color:#111}
main{max-width:760px;margin:auto}.actions{display:flex;gap:12px;flex-wrap:wrap}
button{font:inherit;padding:12px 18px}#rescue,#safety{font-weight:700}
</style>
</head>
<body>
<main data-alos-project="missedcall-rescue-ai" data-source-repository="Gagan8atwal/missedcall-rescue-ai">
<h1>MissedCall Rescue AI — ALOS Integration</h1>
<p>Side-effect-free owner fixture. It does not place calls, send SMS, create leads, or contact external providers.</p>
<div class="actions">
<button id="verify" type="button">Verify rescue flow</button>
<button id="inspect" type="button">Inspect safety gate</button>
</div>
<p id="rescue" aria-live="polite">RESCUE:IDLE</p>
<p id="safety" aria-live="polite">SAFETY:IDLE</p>
<script>
const verify=document.getElementById("verify");
const inspect=document.getElementById("inspect");
const rescue=document.getElementById("rescue");
const safety=document.getElementById("safety");
verify.addEventListener("click",()=>{rescue.textContent="RESCUE:VERIFIED";verify.dataset.verified="true";});
inspect.addEventListener("click",()=>{safety.textContent="SAFETY:VERIFIED";inspect.dataset.inspected="true";});
</script>
</main>
</body>
</html>
